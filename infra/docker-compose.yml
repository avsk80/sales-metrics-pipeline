version: "3.9"

networks:
  data-platform:
    name: data-platform

services:
  # =====================
  # STORAGE: MinIO
  # =====================
  minio:
    profiles: ["data-stack"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../volumes/minio/data:/data
      - ../volumes/minio/logs:/var/log/minio
    networks: [data-platform]
    healthcheck:
      # MinIO exposes a liveness endpoint
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    profiles: ["data-stack"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    networks: [data-platform]
    entrypoint: >
      /bin/sh -ec "
      echo 'Waiting for MinIO to be ready...' &&
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} || true &&
      mc ls local &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET}'
      "

  # =====================
  # COMPUTE: Spark cluster
  # =====================
  spark-master:
    profiles: ["data-stack"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8081
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../volumes/spark/events:/opt/spark-events
      - ../volumes/spark/logs:/opt/spark/logs
    networks: [data-platform]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker-1:
    profiles: ["data-stack"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on: [spark-master]
    environment:
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    ports:
      - "8082:8082"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../volumes/spark/events:/opt/spark-events
      - ../volumes/spark/logs:/opt/spark/logs
    networks: [data-platform]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-worker-2:
    profiles: ["data-stack"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on: [spark-master]
    environment:
      - SPARK_WORKER_WEBUI_PORT=8083
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    ports:
      - "8083:8083"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../volumes/spark/events:/opt/spark-events
      - ../volumes/spark/logs:/opt/spark/logs
    networks: [data-platform]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-history:
    profiles: ["data-stack"]
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on:
      - spark-master
    ports:
      - "18080:18080"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../volumes/spark/events:/opt/spark-events
      - ../volumes/spark/logs:/opt/spark/logs
    networks: [data-platform]
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.ui.port=18080 -Dspark.history.fs.logDirectory=file:/opt/spark-events
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]

  # =====================
  # METASTORE: Postgres + Hive Metastore
  # =====================
  hive-metastore-db:
    profiles: ["data-stack"]
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HMS_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ../volumes/postgres/metastore:/var/lib/postgresql/data
    networks: [data-platform]

  hive-metastore:
    profiles: ["data-stack"]
    build:
      context: ./hive
      dockerfile: Dockerfile
    depends_on: [hive-metastore-db, minio]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HMS_POSTGRES_PASSWORD}
    ports:
      - "9083:9083"
    volumes:
      - ./hive/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
      - ../volumes/hive/logs:/opt/hive/logs
    networks: [data-platform]

  # =====================
  # QUERY: Trino
  # =====================
  trino:
    profiles: ["data-stack"]
    image: trinodb/trino:457
    depends_on: [hive-metastore, minio]
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ../volumes/trino/data:/var/trino/data
      - ../volumes/trino/logs:/var/trino/logs
    networks: [data-platform]

  # =====================
  # ORCHESTRATION: Airflow
  # =====================
  airflow-db:
    profiles: ["airflow"]
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ../volumes/postgres/airflow:/var/lib/postgresql/data
    networks: [data-platform]

  airflow-redis:
    profiles: ["airflow"]
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ../volumes/airflow/redis:/data
    networks: [data-platform]

  airflow-init:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4
    depends_on: [airflow-db, airflow-redis]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - ../volumes/airflow/dags:/opt/airflow/dags
      - ../volumes/airflow/logs:/opt/airflow/logs
      - ../volumes/airflow/plugins:/opt/airflow/plugins
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true
      "
    networks: [data-platform]

  airflow-webserver:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4
    depends_on: [airflow-init]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8088:8080"
    volumes:
      - ../volumes/airflow/dags:/opt/airflow/dags
      - ../volumes/airflow/logs:/opt/airflow/logs
      - ../volumes/airflow/plugins:/opt/airflow/plugins
    command: webserver
    networks: [data-platform]

  airflow-scheduler:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4
    depends_on: [airflow-init]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ../volumes/airflow/dags:/opt/airflow/dags
      - ../volumes/airflow/logs:/opt/airflow/logs
      - ../volumes/airflow/plugins:/opt/airflow/plugins
    command: scheduler
    networks: [data-platform]

  airflow-worker:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4
    depends_on: [airflow-init]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ../volumes/airflow/dags:/opt/airflow/dags
      - ../volumes/airflow/logs:/opt/airflow/logs
      - ../volumes/airflow/plugins:/opt/airflow/plugins
    command: celery worker
    networks: [data-platform]

